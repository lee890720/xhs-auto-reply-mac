[project]
name = "xhs-auto-reply"
version = "2.0.0"
description = "小红书评论自动回复系统 - 本地守护进程 + 菜单栏 App"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.48.0",
    "httpx>=0.27.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.2",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
menubar = ["rumps>=0.4.0"]

[project.scripts]
xhsd = "xhsd.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["xhsd", "xhsd.llm"]
